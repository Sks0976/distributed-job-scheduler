spring:
  application:
    name: distributed-job-scheduler
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scheduler}
    username: ${DB_USER:scheduler}
    password: ${DB_PASSWORD:scheduler}
    hikari:
      maximum-pool-size: 20
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

scheduler:
  # Unique per node; used to fence completions and release locks on shutdown.
  node-id: ${NODE_ID:node-local}
  worker:
    enabled: ${WORKER_ENABLED:true}
    threads: ${WORKER_THREADS:8}
    batch-size: 20
    poll-interval: 500ms
    shutdown-timeout: 20s
  retry:
    base-delay: 2s
    max-delay: 5m
    jitter: 0.2
  lease:
    # Extra time on top of a job's timeout before other nodes consider it abandoned.
    grace: 30s
    reaper-interval: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      node: ${scheduler.node-id}

logging:
  pattern:
    level: "%5p [${scheduler.node-id}]"
